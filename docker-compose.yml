version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: seo-vitals-postgres
    environment:
      POSTGRES_USER: seo_vitals
      POSTGRES_PASSWORD: seo_vitals_password
      POSTGRES_DB: seo_vitals
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_vitals"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: seo-vitals-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-vitals-app
    environment:
      DATABASE_URL: "postgresql://seo_vitals:seo_vitals_password@postgres:5432/seo_vitals?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CRAWLER_USER_AGENT: "SEO-Vitals-Monitor/1.0"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Worker for background jobs
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-vitals-worker
    command: ["node", "node_modules/.bin/tsx", "src/lib/jobs/worker.ts"]
    environment:
      DATABASE_URL: "postgresql://seo_vitals:seo_vitals_password@postgres:5432/seo_vitals?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
